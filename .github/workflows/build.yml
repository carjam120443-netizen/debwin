name: Build debwin ISO

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out debwin
        uses: actions/checkout@v4

      - name: Install live-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            debian-archive-keyring \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools

      - name: Build debwin
        run: |
          chmod +x auto/config auto/build build.sh config/hooks/live/0100-debwin.chroot
          ./auto/config
          sudo ./auto/build

      - name: List generated files
        run: |
          ls -lh
          sha256sum ./*.iso > debwin-iso.sha256
          cat debwin-iso.sha256

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: debwin-amd64-iso
          path: "*.iso"
          if-no-files-found: error

      - name: Upload SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: debwin-sha256
          path: debwin-iso.sha256
          if-no-files-found: error
